name: Build Auto-Updating Spicy Kingdom POS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Square 1024x1024 App Icon & Build APK
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          [ -f operations.html ] && cp operations.html www/operations.html

          # 1. Initialize Capacitor + Filesystem & Share plugins for native APK downloads
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets sharp

          # 2. Download logo & pad onto a 1024x1024 square canvas
          if [ ! -f "assets/icon.png" ]; then
            curl -L -s "https://i.ibb.co/Gf35mFfm/spicy-kingdom-black-transparent.png" -o raw_logo.png
            node -e '
              const sharp = require("sharp");
              sharp("raw_logo.png")
                .resize(780, 780, { fit: "inside" })
                .extend({ top: 122, bottom: 122, left: 122, right: 122, background: "#FFF7ED" })
                .resize(1024, 1024, { fit: "contain", background: "#FFF7ED" })
                .png()
                .toFile("assets/icon-only.png")
                .then(() => require("fs").copyFileSync("assets/icon-only.png", "assets/icon.png"));
            '
          else
            cp assets/icon.png assets/icon-only.png
          fi

          # 3. Initialize Capacitor with your live GitHub Pages URL
          npx cap init "Spicy Kingdom POS" "com.spicykingdom.pos" --web-dir www

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.spicykingdom.pos",
            "appName": "Spicy Kingdom POS",
            "webDir": "www",
            "server": {
              "url": "https://spicykingdom.github.io/",
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

          # 4. Generate Custom Android App Icons
          npx capacitor-assets generate --android --iconBackgroundColor '#FFF7ED'

          # 5. Allow HTTPS/Cleartext, Storage Permissions & Rose Status Bar
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>/' "$MANIFEST"

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          if [ -n "$MAIN_ACT" ]; then
            sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState); getWindow().setStatusBarColor(android.graphics.Color.parseColor("#E11D48"));/' "$MAIN_ACT"
          fi

          # 6. Sync & Compile APK
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Spicy Kingdom POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Spicy-Kingdom-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
